<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
	<meta name="theme-color" content='<%= APP_ISTEMPLATE ? "{{ or .ThemeColor \"" + APP_THEME_COLOR + "\" }}" : APP_THEME_COLOR %>' />
	<link href="/font-awesome-4.7.0/css/font-awesome.min.css" rel="stylesheet">
	<link href="/fonts/fonts.css" rel="stylesheet">
	<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
	<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
	<link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
	<link rel="manifest" href="/site.webmanifest">
	<script type="text/javascript">
window.appProps = {<% if (APP_ISTEMPLATE) { %>
{{- if .Realm }}
	realm: {
		id: "{{ .Realm.ID | js }}",
		name: "{{ .Realm.Name | js }}",
		image: {{ with .Image }}{
			id: "{{ .ID | js }}",
			rendering: "{{ .Rendering | js }}",
		}{{ else }}null{{ end }},
		icon: {{ with .Icon }}{
			id: "{{ .ID | js }}",
			rendering: "{{ .Rendering | js }}",
		}{{ else }}null{{ end }},
	},
	theme: null,
	apiHostPath: "{{ .Realm.APIWSPath | js }}",
	apiWebresourcePath: "{{ .Realm.APIResourcePath | js }}",
	apiFilePath: "{{ .Realm.APIFilePath | js }}",
{{- end }}
{{- with .Error }}
	error: {{ . }},
{{- end }}<% } else { %>
	realm: {
		name: <%= JSON.stringify(APP_TITLE) %>,
		image: <%= JSON.stringify(APP_IMAGE) %>,
		icon: <%= JSON.stringify(APP_ICON) %>,
	},
	theme: <%= JSON.stringify(APP_THEME || null) %>,
	apiHostPath: <%= JSON.stringify(API_HOST_PATH) %>,
	apiWebresourcePath: <%= JSON.stringify(API_WEBRESOURCE_PATH) %>,
	apiFilePath: <%= JSON.stringify(API_FILE_PATH) %>,<% } %>
};
(function() {
	var base = (window.appProps.theme || {})['color.base'];
	if (base) {
		document.documentElement.style.setProperty('--mu-color-base', base);
	}
})();
	</script>
	<style>body { background: var(--mu-color-base, <%= htmlWebpackPlugin.options.baseColor %>); }</style>
	<title><%= APP_ISTEMPLATE ? "{{ with .Realm }}{{ .Name | html }}{{ end }}" : htmlWebpackPlugin.options.title %> script editor</title>
</head>
<body>
</body>
</html>
